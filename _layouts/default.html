<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <style>
    :root {
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --text: #1a1a1a;
      --muted: #57606a;
      --border: #e2e5e9;
      --bg-subtle: #f6f8fa;
    }
    * { box-sizing: border-box; }
    body {
      max-width: 46em;
      margin: 0 auto;
      padding: 0 1em 3em;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
    }
    nav.site-nav {
      display: flex;
      gap: 1.5em;
      align-items: center;
      padding: 1.25em 0;
      margin-bottom: 1.5em;
      border-bottom: 1px solid var(--border);
    }
    nav.site-nav a {
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95em;
    }
    nav.site-nav a:hover { color: var(--accent); }
    nav.site-nav a.active { color: var(--accent); }
    h1, h2, h3 {
      line-height: 1.25;
    }
    h1 { font-size: 1.9em; margin-top: 0.2em; }
    h2 {
      font-size: 1.35em;
      margin-top: 1.8em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border);
    }
    h3 { font-size: 1.1em; color: var(--muted); }
    a { color: var(--accent); }
    a:hover { color: var(--accent-dark); }
    pre {
      overflow-x: auto;
      background: var(--bg-subtle);
      padding: 1em;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    code {
      background: var(--bg-subtle);
      padding: 0.15em 0.35em;
      border-radius: 4px;
      font-size: 0.92em;
    }
    pre code { background: none; padding: 0; }
    img { max-width: 100%; border-radius: 4px; }
    blockquote {
      border-left: 3px solid var(--accent);
      margin-left: 0;
      padding: 0.2em 1em;
      color: var(--muted);
      background: var(--bg-subtle);
      border-radius: 0 4px 4px 0;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.5em 0.75em;
      text-align: left;
    }
    th { background: var(--bg-subtle); }
    .stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5em;
      margin: 1.5em 0;
      padding: 1em 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat-row .stat-num {
      font-size: 1.5em;
      font-weight: 700;
      color: var(--accent);
      display: block;
    }
    .stat-row .stat-label {
      font-size: 0.85em;
      color: var(--muted);
    }
    .topic-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5em;
      margin: 1em 0;
    }
    .topic-tags span {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.3em 0.9em;
      font-size: 0.88em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="https://lonestarcoder.github.io"{% if page.permalink == "/" %} class="active"{% endif %}>Home</a>
    <a href="https://lonestarcoder.github.io/about"{% if page.permalink == "/about" %} class="active"{% endif %}>About</a>
    <a href="https://lonestarcoder.github.io/blog/home"{% if page.permalink contains "/blog/" %} class="active"{% endif %}>Blog</a>
    <a href="https://lonestarcoder.github.io/articles"{% if page.permalink contains "/articles" %} class="active"{% endif %}>Articles</a>
  </nav>
  {{ content }}
</body>
</html>
