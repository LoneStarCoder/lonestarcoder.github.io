<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <style>
    body {
      max-width: 46em;
      margin: 0 auto;
      padding: 1.5em 1em;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #1a1a1a;
    }
    nav {
      margin-bottom: 1.5em;
      font-size: 1.05em;
    }
    nav table, nav td {
      border: none;
      padding: 0;
    }
    nav table {
      display: inline;
    }
    nav a {
      margin-right: 0.75em;
    }
    a { color: #0645ad; }
    pre {
      overflow-x: auto;
      background: #f6f8fa;
      padding: 1em;
      border-radius: 4px;
    }
    code {
      background: #f6f8fa;
      padding: 0.15em 0.3em;
      border-radius: 3px;
    }
    pre code { background: none; padding: 0; }
    img { max-width: 100%; }
    blockquote {
      border-left: 3px solid #ddd;
      margin-left: 0;
      padding-left: 1em;
      color: #555;
    }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
